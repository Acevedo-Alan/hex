app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  # Firma los tokens de sesión (cookie HttpOnly por jugador). El default es
  # SOLO para levantar el proyecto local sin configurar nada — cualquier
  # despliegue compartido o público tiene que pisarlo con una variable de
  # entorno real, si no cualquiera podría firmar tokens válidos a mano.
  session-secret: ${SESSION_SECRET:dev-only-secret-cambiar-en-produccion}